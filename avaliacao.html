<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#003DA5">
<title>Avaliação Inovelar</title>
<style>body{margin:0;background:#F4F7FC;color:#10294F;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}a{color:#003DA5}</style>
</head>
<body>
<div id="m">Carregando a Avaliação Inovelar…</div>
<script>
(function(){
  var API="https://script.google.com/macros/s/AKfycbzKz04E4xTJSUYgh7cJoSKHgYD4uynC_-4eTHU7zHvU9dZF0YK6NnUVxdKEi-kA7LY5/exec";
  var chave=new URLSearchParams(location.search).get("k")||"", t=0;
  function go(){
    fetch(API,{method:"POST",body:JSON.stringify({fn:"pagina",args:[chave]}),credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"}})
    .then(function(r){return r.json()})
    .then(function(j){ if(!j||typeof j.r!=="string") throw 0; document.open(); document.write(j.r); document.close(); })
    .catch(function(){ if(++t<3){ setTimeout(go,1500); } else { document.getElementById("m").innerHTML='Não consegui abrir agora.<br><a href="">Tentar de novo</a>'; } });
  }
  go();
})();
</script>
</body>
</html>
