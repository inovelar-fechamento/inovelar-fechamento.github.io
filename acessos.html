<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apps Inovelar">
<title>Apps Inovelar · RE/MAX Inovelar</title>
<link rel="manifest" href="apps-inovelar.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="apps-favicon-32.png">
<link rel="apple-touch-icon" href="apps-apple-touch-icon.png">
<style>
:root{--bg:#070b16;--pn:#0e1528;--ln:#22305a;--tx:#e6ecff;--mu:#8fa0c8;--ac:#2fe4ff;--ok:#3ee08f;--rx:#e11b22}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 40px}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px}.logo span{color:var(--rx)}
h1{font-size:26px;margin:14px 0 4px}.sub{color:var(--mu);font-size:14px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
a.card{display:block;text-decoration:none;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:16px;position:relative;transition:border-color .15s}
a.card:hover{border-color:var(--ac)}a.card.off{opacity:.55;pointer-events:none}
.ic{font-size:28px}.t{font-weight:700;font-size:17px;margin:8px 0 4px}.d{color:var(--mu);font-size:13.5px;line-height:1.4}
.st{position:absolute;top:14px;right:14px;font-size:11.5px;padding:3px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.st.on{border-color:#1c6b47;color:var(--ok)}.st.soon{color:#ffc845;border-color:#5a4a18}
.foot{margin-top:22px;color:var(--mu);font-size:13px;line-height:1.5}
.foot button{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;margin-top:8px}
label{display:block;font-size:14px;color:#b9c6ea;margin-bottom:6px}
.box{max-width:420px;margin:0 auto}.lg{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-top:12px}
.lg input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:17px}
.lg input.cod{font-size:28px;letter-spacing:8px;text-align:center}
.lg button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#04121c;font-weight:700;font-size:16px;cursor:pointer}
.lg button:disabled{opacity:.6}
.aviso{background:#2a2410;border:1px solid #5a4a18;color:#ffe4a3;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.hide{display:none!important}.quem{color:var(--mu);font-size:13px;margin-top:6px}
.mdl{position:fixed;inset:0;background:rgba(3,6,14,.86);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.mdl .pn{background:var(--pn);border:1px solid var(--ln);border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:22px 18px 28px}
@media(min-width:700px){.mdl{align-items:center}.mdl .pn{border-radius:20px}}
.mdl h2{margin:0 0 4px;font-size:22px}.op{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:16px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:18px;font-weight:700;cursor:pointer;text-align:left}
.op small{display:block;font-weight:400;color:var(--mu);font-size:13px;margin-top:2px}.op.eu{border:2px solid var(--ac)}.op .e{font-size:30px}
.passo{display:flex;gap:12px;align-items:center;margin-top:14px;font-size:17px;line-height:1.35}.passo .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--rx);color:#fff;font-weight:800;display:grid;place-items:center}
.big{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;background:var(--ac);color:#04121c;font-weight:800;font-size:17px;cursor:pointer;text-align:center;text-decoration:none}
.fec{background:none;border:0;color:var(--mu);font-size:15px;margin-top:14px;width:100%;cursor:pointer}
.seta{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:46px;animation:pul 1s infinite;z-index:60}
.seta.cima{bottom:auto;top:4px;left:auto;right:70px;transform:none}@keyframes pul{50%{opacity:.25}}
</style>
</head>
<body>
<div class="wrap" id="w">Carregando…</div>
<script>
/* Apps Inovelar (21/11/2026) — login único: e-mail + código UMA vez aqui libera todos os apps neste aparelho.
   Servidor da Avaliação: pedirCodigoEntrada / entrarComCodigo / centralChaves (chave da Avaliação e Contratos, código do SH e um
   passe de uso único). Servidor do Summit: entrarPelaCentral(passe) devolve a sessão do Meu Plano.
   Quem não é da loja (ex.: Bruno Novaes) não entra aqui: usa o link pessoal do SH, que continua com o login próprio. */
(function(){
  var AV="https://script.google.com/macros/s/AKfycbzKz04E4xTJSUYgh7cJoSKHgYD4uynC_-4eTHU7zHvU9dZF0YK6NnUVxdKEi-kA7LY5/exec",
      SM="https://script.google.com/macros/s/AKfycbzuymYfKYw90PZCY3AB6FHqTc7OmkxA5lEmw_s8eTJRW-NsKRYki9W26Q22E5ZFQ3Be/exec";
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function $(s){return document.querySelector(s);}
  function post(u,fn,args,t){t=t||0;return fetch(u,{method:"POST",body:JSON.stringify({fn:fn,args:args||[]}),credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"}})
    .then(function(r){return r.json();}).then(function(j){if(j&&j.e!==undefined){var e=new Error(j.e);e.srv=1;throw e;}if(j&&j.ok===false){var e2=new Error(j.erro||"Não deu certo.");e2.srv=1;throw e2;}return j?j.r:null;})
    .catch(function(e){if(e.srv||t>=2)throw e;return new Promise(function(ok){setTimeout(ok,1500);}).then(function(){return post(u,fn,args,t+1);});});}
  // Para incluir um app novo: uma linha aqui (ícone, nome, descrição, link, chave que mostra "conectado")
  var APPS=[
    {ic:"🏢",t:"App do SH Paradiso",d:"Mapa das unidades, reservas, vendas e simulação de pagamento.",u:"./",k:"inovelar_sh_k"},
    {ic:"📝",t:"Contratos",d:"Pedir o contrato de compra e venda: envie os documentos ou preencha; acompanhe e baixe o PDF liberado.",u:"contratos.html",k:"inovelar_av_k"},
    {ic:"🏷️",t:"Avaliação de imóveis",d:"Estudo de preço com amostras de vendidos e ofertas da região.",u:"avaliacao.html",k:"inovelar_av_k"},
    {ic:"🎯",t:"Meu Plano 2027",d:"O seu plano do Agent Summit: metas, rotina e cockpit.",u:"summit.html",k:"mp27_token"}
  ];
  var CHAVES=["inovelar_av_k","inovelar_sh_k","mp27_token","mp27_gestor","mp27_backup","inovelar_apps_nome","inovelar_apps_em"];
  var q=new URLSearchParams(location.search), volta=(q.get("volta")||"").replace(/[^a-z0-9_.-]/gi,""), W=$("#w");
  function chaveDe(u){var a=APPS.filter(function(x){return x.u===u;})[0];if(a)return a.k;if(/^avaliacao/.test(u)||u==="contratos.html")return "inovelar_av_k";if(u==="index.html"||/^sh/.test(u))return "inovelar_sh_k";if(u==="summit.html")return "mp27_token";return null;}
  function sairTudo(){CHAVES.forEach(function(k){ls(k,null);});}
  /* busca no servidor as chaves de todos os apps para quem já entrou */
  function atualizar(){
    var k=ls("inovelar_av_k");
    return post(AV,"centralChaves",[k]).then(function(r){
      ls("inovelar_apps_nome",r.nome||"");ls("inovelar_apps_em",String(Date.now()));
      if(r.sh)ls("inovelar_sh_k",r.sh);
      return post(SM,"entrarPelaCentral",[r.passe]).then(function(s){ls("mp27_token",s.token);if(s.admin)ls("mp27_gestor",s.token);}).catch(function(e){if(/lista/i.test(e.message)){ls("mp27_token",null);ls("mp27_gestor",null);}});
    });
  }
  function cards(msg){
    var nome=ls("inovelar_apps_nome")||"";
    W.innerHTML='<div class="logo">RE/<span>MAX</span> Inovelar</div><h1>O que você quer acessar hoje?</h1>'+
      '<p class="sub">Apps Inovelar — você entrou uma vez e todos os sistemas ficam liberados neste aparelho.</p>'+(nome?'<p class="quem">Conectado como <b>'+esc(nome)+'</b></p>':'')+
      (msg?'<div class="aviso">'+esc(msg)+'</div>':'')+'<div class="lg" id="inst" style="display:none;max-width:none;margin:14px 0 4px;border:2px solid var(--ac)"><b>📲 Instale o aplicativo no seu computador ou celular</b><p class="sub" style="margin:6px 0 0">Fica um ícone na área de trabalho ou na tela inicial e abre direto aqui, sem precisar procurar o link.</p><button id="bInst">Instalar o aplicativo</button></div>'+'<div class="grid" id="g"></div>'+
      '<div class="foot"><b>Dica:</b> salve esta página na tela inicial do celular (no iPhone: Compartilhar › Adicionar à Tela de Início; no Android: ⋮ › Adicionar à tela inicial). Ela vira um ícone como um aplicativo.<br><button id="sair">Sair de todos os apps neste aparelho</button></div>';
    $("#g").innerHTML=APPS.map(function(a){var on=a.k&&ls(a.k);
      return '<a class="card'+(on?'':' off')+'" href="'+a.u+'">'+(on?'<span class="st on">● liberado</span>':'<span class="st soon">sem acesso</span>')+'<div class="ic">'+a.ic+'</div><div class="t">'+a.t+'</div><div class="d">'+a.d+'</div></a>';}).join("");
    mostraInstalar();
    $("#sair").onclick=function(){if(!confirm("Sair de todos os apps neste aparelho? Na próxima vez vai pedir o seu e-mail de novo."))return;sairTudo();location.href=location.pathname;};
  }
  /* ícone para instalar (Chrome/Edge no computador e Android); no iPhone vale a dica do Compartilhar */
  var promptInst=null;
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();promptInst=e;});
  window.addEventListener("appinstalled",function(){promptInst=null;var b=$("#inst");if(b)b.style.display="none";});
  try{if("serviceWorker" in navigator)navigator.serviceWorker.register("apps-sw.js",{scope:"./"}).catch(function(){});}catch(e){}
  var UA=navigator.userAgent||"", EH_IOS=/iPhone|iPad|iPod/i.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1),
      EH_AND=/Android/i.test(UA), WEBVIEW=/WhatsApp|FBAN|FBAV|Instagram|; wv\)/i.test(UA)||(EH_IOS&&!/Safari\//.test(UA)),
      IOS_OUTRO=EH_IOS&&/CriOS|FxiOS|EdgiOS/.test(UA), SAFARI_MAC=!EH_IOS&&/Macintosh/.test(UA)&&/Safari\//.test(UA)&&!/Chrome|Edg\//.test(UA);
  var URL_APP="https://inovelar-fechamento.github.io/acessos.html?instalar=1";
  function fecharM(){var m=$("#mdl");if(m)m.remove();var a=document.querySelectorAll(".seta");for(var k=0;k<a.length;k++)a[k].remove();}
  function modal(h){fecharM();var d=document.createElement("div");d.className="mdl";d.id="mdl";d.innerHTML='<div class="pn">'+h+'<button class="fec" id="mFec">Fechar</button></div>';document.body.appendChild(d);
    $("#mFec").onclick=fecharM;d.onclick=function(e){if(e.target===d)fecharM();};}
  function passos(t,lista,extra){return '<h2>'+t+'</h2>'+lista.map(function(p,n){return '<div class="passo"><span class="n">'+(n+1)+'</span><span>'+p+'</span></div>';}).join("")+(extra||"");}
  function instalarJa(){var p=promptInst;if(!p)return false;promptInst=null;fecharM();p.prompt();if(p.userChoice)p.userChoice.then(function(c){if(c&&c.outcome==="accepted"){var b=$("#inst");if(b)b.style.display="none";}});return true;}
  function escolher(){
    var eu=EH_IOS?"ios":EH_AND?"and":"pc";
    function op(id,e,t,sub){return '<button class="op'+(id===eu?' eu':'')+'" data-op="'+id+'"><span class="e">'+e+'</span><span>'+t+'<small>'+(id===eu?'é este aparelho · ':'')+sub+'</small></span></button>';}
    modal('<h2>Onde você quer instalar?</h2><p class="sub">Toque na opção do seu aparelho.</p>'+op("ios","🍎","iPhone ou iPad","celular da Apple")+op("and","🤖","Celular Android","Samsung, Motorola, Xiaomi…")+op("pc","💻","Computador","Windows ou Mac"));
    var bs=document.querySelectorAll("[data-op]");for(var k=0;k<bs.length;k++)bs[k].onclick=function(){var o=this.getAttribute("data-op");
      if(o==="ios")return iphone();if(o==="and")return android();return computador();};
  }
  function outroAparelho(nome){modal('<h2>Abra este link no '+nome+'</h2><p class="sub" style="font-size:16px;line-height:1.45">A instalação é feita no próprio aparelho. Abra lá o link abaixo, entre com o seu e-mail e toque em <b>Instalar o aplicativo</b>.</p><a class="big" href="#" id="cp">Copiar o link</a>');
    $("#cp").onclick=function(e){e.preventDefault();try{navigator.clipboard.writeText("https://inovelar-fechamento.github.io/acessos.html");this.textContent="Link copiado ✓";}catch(x){this.textContent="inovelar-fechamento.github.io/acessos.html";}};}
  function iphone(){
    if(!EH_IOS)return outroAparelho("iPhone");
    if(WEBVIEW||IOS_OUTRO){modal('<h2>Primeiro, abrir no Safari</h2><p class="sub" style="font-size:16px">O iPhone só instala pelo Safari. Toque no botão abaixo:</p><a class="big" href="x-safari-'+URL_APP+'">Abrir no Safari</a>');return;}
    modal(passos("No iPhone são 3 toques",["Toque nos <b>três tracinhos ☰</b> lá embaixo, à esquerda do endereço (a seta piscando mostra)","Toque em <b>Compartilhar</b>","Toque em <b>Adicionar à Tela de Início</b> (se não aparecer, role ou toque em <b>Ver mais</b>) e depois em <b>Adicionar</b>"],'<p class="sub" style="margin-top:14px">iPhone mais antigo, sem os três tracinhos? Toque direto no botão <b>Compartilhar</b> ⬆️ e siga o passo 3.</p>'));
    var m=$("#mdl");if(m){m.style.alignItems="center";m.querySelector(".pn").style.borderRadius="20px";}var s=document.createElement("div");s.className="seta";s.style.left="29%";s.textContent="⬇️";document.body.appendChild(s);
  }
  function android(){
    if(!EH_AND)return outroAparelho("celular Android");
    if(instalarJa())return;
    if(WEBVIEW){location.href="intent://inovelar-fechamento.github.io/acessos.html?instalar=1#Intent;scheme=https;package=com.android.chrome;end";return;}
    modal(passos("No Android",["Toque nos <b>⋮</b> (três pontinhos, lá em cima)","Toque em <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>) e confirme"],'<p class="sub" style="margin-top:14px">Se não aparecer "Instalar", o aplicativo já está instalado: procure o ícone <b>Apps Inovelar</b>.</p>'));
    var s=document.createElement("div");s.className="seta cima";s.style.right="8px";s.textContent="⬆️";document.body.appendChild(s);
  }
  function computador(){
    if(EH_IOS||EH_AND)return outroAparelho("computador");
    if(instalarJa())return;
    if(SAFARI_MAC){modal(passos("No Mac (Safari)",["No menu lá em cima, clique em <b>Arquivo</b>","Clique em <b>Adicionar ao Dock</b> e depois em <b>Adicionar</b>"]));return;}
    modal(passos("No computador",["Clique no ícone de instalar no <b>fim da barra de endereço</b> (um monitor com uma setinha), lá em cima","Clique em <b>Instalar</b>"],'<p class="sub" style="margin-top:14px">Não achou o ícone? Ele não aparece quando o aplicativo já está instalado: procure <b>Apps Inovelar</b> na área de trabalho ou no menu Iniciar.</p>'));
    var s=document.createElement("div");s.className="seta cima";s.textContent="⬆️";document.body.appendChild(s);
  }
  function mostraInstalar(){var b=$("#inst");if(!b)return;if(window.matchMedia&&matchMedia("(display-mode: standalone)").matches){b.style.display="none";return;}b.style.display="block";
    $("#bInst").onclick=escolher;
    if(q.has("instalar")){history.replaceState(null,"",location.pathname);setTimeout(escolher,300);}}
  function seguir(msgSemAcesso){
    if(volta){var kk=chaveDe(volta);if(kk&&ls(kk)){location.replace(volta);return;}cards("Seu acesso a este app ainda não está liberado. Fale com o Brenno ou a Andréia.");return;}
    cards(msgSemAcesso);
  }
  function login(msg){
    W.innerHTML='<div class="box"><div class="logo">RE/<span>MAX</span> Inovelar</div><h1>Apps Inovelar</h1><p class="sub">Entre uma vez com o seu e-mail e todos os apps da loja ficam liberados neste aparelho.</p>'+(msg?'<div class="aviso">'+esc(msg)+'</div>':'')+
      '<div class="lg" id="pE"><label>Seu e-mail</label><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="seuemail@remax.com.br" value="'+esc(ls("inovelar_sh_email")||"")+'"><button id="bE">Receber código</button></div>'+
      '<div class="lg hide" id="pC"><label>Digite o código de 6 números que chegou no seu e-mail</label><input id="cod" class="cod" inputmode="numeric" autocomplete="one-time-code" maxlength="7"><button id="bC">Entrar</button><p class="sub" style="margin-top:10px">Não chegou? Olhe o spam ou <a href="#" id="tr" style="color:var(--ac)">pedir de novo</a>. O Brenno e a Andréia também conseguem ver o seu código.</p></div></div>';
    var em=$("#em"),bE=$("#bE"),bC=$("#bC"),cod=$("#cod");
    function aviso(t){var a=document.querySelector(".aviso");if(!a){a=document.createElement("div");a.className="aviso";document.querySelector(".box .sub").after(a);}a.textContent=t;}
    bE.onclick=function(){var e=em.value.trim().toLowerCase();if(!e)return em.focus();bE.disabled=true;bE.textContent="Enviando…";
      post(AV,"pedirCodigoEntrada",[e]).then(function(r){if(!r||!r.ok){aviso((r&&r.motivo)||"Não deu certo. Tente de novo.");return;}ls("inovelar_sh_email",e);$("#pE").classList.add("hide");$("#pC").classList.remove("hide");cod.focus();if(r.aviso)aviso(r.aviso);})
      .catch(function(){aviso("Sem conexão com o sistema. Confira a internet e tente de novo.");}).then(function(){bE.disabled=false;bE.textContent="Receber código";});};
    em.onkeydown=function(ev){if(ev.key==="Enter")bE.click();};
    $("#tr").onclick=function(ev){ev.preventDefault();$("#pC").classList.add("hide");$("#pE").classList.remove("hide");};
    bC.onclick=function(){bC.disabled=true;bC.textContent="Entrando…";
      post(AV,"entrarComCodigo",[em.value.trim().toLowerCase(),cod.value]).then(function(r){if(!r||!r.ok){aviso((r&&r.motivo)||"Não deu certo.");bC.disabled=false;bC.textContent="Entrar";return;}
        ls("inovelar_av_k",String(r.k).toUpperCase());W.innerHTML="Liberando os apps…";
        return atualizar().then(function(){seguir();}).catch(function(e){seguir("Entrou, mas não consegui liberar todos os apps agora ("+e.message+"). Toque em um app para tentar.");});})
      .catch(function(){aviso("Sem conexão com o sistema.");bC.disabled=false;bC.textContent="Entrar";});};
    cod.oninput=function(){if(cod.value.replace(/\D/g,"").length===6)bC.click();};
  }
  if(q.has("sair")){sairTudo();history.replaceState(null,"",location.pathname);login("Você saiu de todos os apps neste aparelho.");return;}
  var msg=q.get("msg")||"";
  if(!ls("inovelar_av_k")){login(msg);return;}
  // já entrou: confere e completa as chaves (rápido) e segue
  var falta=APPS.some(function(a){return a.k&&!ls(a.k);})&&(Date.now()-Number(ls("inovelar_apps_em")||0)>6*3600e3);
  if(volta||falta){W.innerHTML="Conferindo o seu acesso…";
    atualizar().then(function(){seguir();}).catch(function(e){if(/Acesso (não liberado|bloqueado)/i.test(e.message)){sairTudo();login(/bloqueado/i.test(e.message)?"Seu acesso está bloqueado. Fale com a gestão.":"Seu acesso mudou. Entre de novo com o seu e-mail.");}else seguir();});
  } else cards(msg);
})();
</script>
</body>
</html>
