<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b16">
<title>Fechamento Inovelar</title>
<style>body{margin:0;background:#070b16;color:#e6ecff;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}a{color:#2fe4ff}</style>
</head>
<body>
<div id="m">Carregando o Fechamento Inovelar…</div>
<script>
(function(){
  var API="https://script.google.com/macros/s/AKfycbzwZKOjtn7srRbLfEZvQj6tIxQxlFG7fsXRKwXMmeyHeKuCLsBaPAZs3PE5EwRFlFEm/exec";
  var q=new URLSearchParams(location.search), gestor=q.has("g"), chave=gestor?q.get("g"):(q.get("k")||""), t=0;
  function go(){
    fetch(API,{method:"POST",body:JSON.stringify({fn:"pagina",args:[gestor?"gestor":"corretor",chave]}),credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"}})
    .then(function(r){return r.json()})
    .then(function(j){ if(!j||typeof j.r!=="string") throw 0; document.open(); document.write(j.r); document.close(); })
    .catch(function(){ if(++t<3){ setTimeout(go,1500); } else { document.getElementById("m").innerHTML='Não consegui abrir agora.<br><a href="">Tentar de novo</a>'; } });
  }
  go();
})();
</script>
</body>
</html>
