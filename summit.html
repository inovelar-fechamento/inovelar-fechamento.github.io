<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#070b16"><title>Meu Plano 2027 · RE/MAX Inovelar</title>
<style>:root{--bg:#070b16;--pn:#0e1528;--pn2:#131d36;--ln:#22305a;--tx:#e6ecff;--mu:#8fa0c8;--ac:#2fe4ff;--ok:#3ee08f;--wa:#ffc845;--er:#ff5d73;--rx:#e11b22;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac)}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:19px;margin:22px 0 8px;color:var(--ac)}h3{font-size:16px;margin:18px 0 6px}
.sub{color:var(--mu);font-size:14px;margin:0 0 12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin:12px 0}
.row{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed #1c2748}
.row:last-child{border-bottom:0}.row label{font-size:14px}.row small{display:block;color:var(--mu);font-size:12px}
input[type=text],input[type=email],input[type=date],select,textarea{width:100%;background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:10px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}textarea{min-height:76px;resize:vertical}
.num{text-align:right}.pre{border-color:#2b5f88!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#04121a;font-weight:700;cursor:pointer;min-height:46px}
.btn.sec{background:var(--pn2);color:var(--tx);border:1px solid var(--ln)}.btn.red{background:var(--rx);color:#fff}.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.res{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:#0b2232;border:1px solid #17506b;margin-top:8px;font-weight:700}
.res b{color:var(--ac);font-size:18px;white-space:nowrap}
.big{font-size:30px;font-weight:800;color:var(--ac)}
.aviso{border-left:4px solid var(--wa);background:#2a2410;padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.erro{border-left:4px solid var(--er);background:#2a1016;padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.ok{border-left:4px solid var(--ok);background:#0f2a1d;padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--pn2);border:1px solid var(--ln)}
.chip.aceito{background:#0f2a1d;border-color:var(--ok);color:var(--ok)}.chip.rascunho{background:#2a2410;border-color:var(--wa);color:var(--wa)}.chip.nao{color:var(--mu)}
.top{position:sticky;top:0;z-index:5;background:rgba(7,11,22,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--ln)}
.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:900;letter-spacing:.5px}.logo span{color:var(--rx)}
.salvo{margin-left:auto;font-size:12px;color:var(--mu)}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:860px;margin:0 auto;scrollbar-width:none}
.nav button{flex:0 0 auto;border:1px solid var(--ln);background:var(--pn);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.nav button.on{background:var(--ac);color:#04121a;border-color:var(--ac);font-weight:700}.nav button.feito::after{content:" ✓";color:var(--ok)}
.prog{height:4px;background:var(--pn2)}.prog i{display:block;height:4px;background:linear-gradient(90deg,var(--ac),var(--ok));transition:width .4s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab12{overflow-x:auto}.tab12 table{border-collapse:collapse;min-width:900px;font-size:13px}
.tab12 th,.tab12 td{border:1px solid var(--ln);padding:4px}.tab12 th{background:var(--pn2);font-weight:600}.tab12 td input{padding:6px;border-radius:6px;min-width:58px}
.tab12 td.c{text-align:right;font-weight:700;color:var(--ac);padding:4px 8px}
.cock{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cock .k{background:var(--pn2);border-radius:12px;padding:10px}.cock .k small{color:var(--mu);display:block;font-size:12px}.cock .k b{font-size:18px}
.pill{display:flex;gap:6px;flex-wrap:wrap}.pill label{border:1px solid var(--ln);border-radius:999px;padding:7px 11px;font-size:14px;cursor:pointer;background:var(--pn2)}
.pill input{display:none}.pill input:checked+span{color:var(--ac);font-weight:700}
.check label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px}.check input{width:20px;height:20px;margin-top:1px}
.center{min-height:80vh;display:grid;place-items:center;text-align:center}
.codigo{font-size:28px;letter-spacing:8px;text-align:center!important}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--pn2);border:1px solid var(--ac);padding:10px 16px;border-radius:12px;z-index:20;max-width:92vw}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(7,11,22,.96);border-top:1px solid var(--ln);padding:10px 16px;display:flex;gap:8px;justify-content:center;z-index:5}
/* telão */
.tv{padding:22px 28px;min-height:100vh}.tv h1{font-size:34px}.tv .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:16px 0}
.tv .kpi{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px}.tv .kpi small{color:var(--mu);font-size:14px}.tv .kpi b{display:block;font-size:30px;color:var(--ac)}
.tv .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.tv .cards .cr{padding:10px 12px}.tv .cards .cr h4{font-size:17px}.tv .cards .l{font-size:14px}
.tv .cr{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.tv .cr h4{margin:0 0 4px;font-size:20px}.tv .cr .l{display:flex;justify-content:space-between;font-size:15px;padding:2px 0}.tv .cr .l b{color:var(--ac)}
.tv .bar{height:6px;background:var(--pn2);border-radius:9px;margin:8px 0}.tv .bar i{display:block;height:6px;border-radius:9px;background:var(--ac)}
.tv .cr.aceito{border-color:var(--ok);box-shadow:0 0 18px rgba(62,224,143,.25)}
.adm table{width:100%;border-collapse:collapse;font-size:14px}.adm th,.adm td{border-bottom:1px solid var(--ln);padding:8px 6px;text-align:left;vertical-align:top}
@media(max-width:560px){.row{grid-template-columns:1fr 120px}.grid2,.cock{grid-template-columns:1fr}.tv .kpis{grid-template-columns:1fr 1fr}}
@media print{.top,.nav,.foot,.btns,.btn{display:none!important}body{background:#fff;color:#000}.card{border-color:#999;background:#fff}}
/* book ao lado */
.bookfab{position:fixed;right:14px;bottom:78px;z-index:6;background:var(--pn2);border:1px solid var(--ac);color:var(--tx);border-radius:999px;padding:10px 14px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer}
.bookfab.turma{border-color:var(--ok)}
.bookov{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.bookbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.bookbar .t{font-weight:700;margin-right:auto}.bookbar button{min-height:40px;padding:8px 12px}
.bookimg{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:10px;touch-action:pan-y pinch-zoom}
.bookimg img{max-width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.turma-aviso{font-size:13px;color:var(--ok)}
.vernobook{font-size:13px;margin-left:6px}
@media(min-width:1180px){
  body.combook .wrap{max-width:none;margin:0;width:calc(100% - 560px);padding-left:28px}
  body.combook .top{margin-right:560px}
  body.combook .top .in,body.combook .nav{max-width:none;margin:0}
  body.combook .foot{right:560px}
  body.combook .bookov{position:fixed;inset:auto 0 0 auto;top:0;width:560px;border-left:1px solid var(--ln);background:var(--bg);z-index:7}
  body.combook .bookov .fechar{display:none}
  body.combook .bookfab{display:none}
}
/* modo book: tela principal */
.leitor{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column}
.lxtop{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--ln);background:rgba(7,11,22,.96)}
.lxtop .salvo{margin-left:auto}.lxtop .btn{min-height:40px;padding:8px 12px}
.lximg{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:10px;touch-action:pan-y pinch-zoom}
.lximg img{max-width:100%;max-height:100%;height:auto;object-fit:contain;background:#fff;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.lxbar{border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(7,11,22,.96);display:flex;flex-direction:column;gap:8px;align-items:center}
.lxpre{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.lxfill{font-size:17px;padding:14px 22px;box-shadow:0 0 18px rgba(47,228,255,.35);animation:lxpulse 2.4s ease-in-out infinite}
@keyframes lxpulse{50%{box-shadow:0 0 28px rgba(47,228,255,.65)}}
.lxnav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}.lxnav .btn{min-height:42px;padding:8px 16px}
.lxpg{min-width:52px;text-align:center;color:var(--mu);font-weight:700}
body.emleitor .bookfab,body.emleitor .bookov{display:none!important}
body.emleitor{overflow:hidden}
.vbook{margin-left:8px;min-height:36px!important;padding:6px 10px!important;font-size:13px}
@media(max-width:560px){.vbook{font-size:12px;padding:6px 8px!important}.lxtop b{display:none}}
@media print{.leitor{display:none!important}}

/* telão: palco que encaixa a tela inteira na TV */
.tvstage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.tvstage .tv{width:1920px;min-height:0;transform-origin:top left}

<body><div id="app"></div>
<script>window.SUMMIT_API="https://script.google.com/macros/s/AKfycbzuymYfKYw90PZCY3AB6FHqTc7OmkxA5lEmw_s8eTJRW-NsKRYki9W26Q22E5ZFQ3Be/exec";</script>
<script>/* Motor de cálculo do "Meu Plano 2027" — Agent Summit RE/MAX Inovelar.
   Fonte única das contas (book Agent Summit 2027, p.21–31). Usado pela página,
   pelo telão, pelo Apps Script e pelos testes. Sem dependências.
   Todas as contas em centavos onde há dinheiro, para não acumular erro de ponto flutuante. */
(function (root) {
  'use strict';

  // ---------- utilidades ----------
  function num(v) {                       // aceita 1234.5, "1.234,50", "R$ 1.234,50", "45%", "", null
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).trim().replace(/R\$|%|\s/g, '');
    if (!s) return null;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');   // 397.000 = trezentos e noventa e sete mil
    var n = Number(s);
    return isFinite(n) ? n : null;
  }
  function cent(v) { var n = num(v); return n === null ? null : Math.round(n * 100); }
  function reais(c) { return c === null ? null : c / 100; }
  function pct(v) {                        // 45 -> 0.45 ; 0.45 -> 0.45 ; "45%" -> 0.45
    var n = num(v); if (n === null) return null;
    return n > 1 ? n / 100 : n;
  }
  function soma(arr) { var t = 0, tem = false; (arr || []).forEach(function (v) { var c = cent(v); if (c !== null) { t += c; tem = true; } }); return tem ? t : null; }
  function roundHalfUp(x) { return Math.floor(x + 0.5 + 1e-9); }

  // ---------- tabelas do book ----------
  var CLUBES = [ // p.27 — faturamento (VGC) do ano civil
    { nome: 'Pinnacle', min: 6920415.00 },
    { nome: 'Diamond', min: 3460208.00 },
    { nome: 'Titan', min: 2595156.00 },
    { nome: "Chairman's", min: 1730104.00 },
    { nome: 'Platinum', min: 865052.00 },
    { nome: '100%', min: 346021.00 },
    { nome: 'Executive', min: 173010.00 }
  ];
  function clube(vgc) {
    var v = num(vgc); if (v === null) return null;
    for (var i = 0; i < CLUBES.length; i++) if (v >= CLUBES[i].min) return CLUBES[i].nome;
    return 'Abaixo do ' + CLUBES[CLUBES.length - 1].nome;
  }
  function proximoClube(vgc) {
    var v = num(vgc) || 0;
    for (var i = CLUBES.length - 1; i >= 0; i--) if (v < CLUBES[i].min) return { nome: CLUBES[i].nome, falta: Math.round((CLUBES[i].min - v) * 100) / 100 };
    return null;
  }
  var REGUA_CRE = [ // p.30
    { max: 4, txt: 'Não tem negócio' },
    { max: 10, txt: 'Negócio lento' },
    { max: 15, txt: 'Negócio — ciclo saudável' },
    { max: 18, txt: 'Negócio feliz' },
    { max: 23, txt: 'Alta performance — exige estrutura de apoio' },
    { max: Infinity, txt: 'Perda de eficácia — excesso de contratos sem apoio' }
  ];
  function reguaCRE(n) { var v = num(n); if (v === null) return null; for (var i = 0; i < REGUA_CRE.length; i++) if (v <= REGUA_CRE[i].max) return REGUA_CRE[i].txt; }
  var FAIXAS = [40, 45, 60, 70]; // p.26
  // tabela vinda da aba CONFIG (muda todo ano). Só aceita se estiver completa e coerente; senão mantém a do book.
  function configurar(cfg) {
    if (!cfg) return false; var ok = false;
    if (cfg.clubes && cfg.clubes.length) {
      var l = cfg.clubes.map(function (c) { return { nome: String(c.nome || '').trim(), min: num(c.min) }; }).filter(function (c) { return c.nome && c.min > 0; });
      if (l.length === cfg.clubes.length) { l.sort(function (a, b) { return b.min - a.min; }); CLUBES.length = 0; l.forEach(function (c) { CLUBES.push(c); }); ok = true; }
    }
    if (cfg.faixas && cfg.faixas.length) { var f = cfg.faixas.map(num).filter(function (x) { return x > 0 && x <= 100; }); if (f.length === cfg.faixas.length) { FAIXAS.length = 0; f.forEach(function (x) { FAIXAS.push(x); }); } }
    return ok;
  }
  function clubeMinimo() { return CLUBES[CLUBES.length - 1].min; }
  var PONTOS = { contato: 0.5, v1: 1, cre: 2, venda: 4 }; // p.35
  var AUTO = [ // p.16 — soma das 6 notas (1 a 5)
    { max: 12, txt: 'Você executa. Seu desafio é ambição, não disciplina. Suba a meta.' },
    { max: 20, txt: 'Você executa em partes. Escolha as duas afirmações de maior nota e ataque só elas em 2027.' },
    { max: 30, txt: 'A execução é o seu gargalo. Planeje menor e cumpra. Use o pacto e cobre o seu broker pela cadência.' }
  ];

  // ---------- passo 2 ----------
  var GRUPOS_PESSOAL = ['casa', 'transporte', 'saude', 'educacao', 'pessoal', 'lazer', 'financeiro', 'imprevistos'];
  var GRUPOS_NEGOCIO = ['locomocao', 'mktCaptacao', 'mktVenda', 'portalBoost', 'administrativo', 'formacao'];

  function passo2(p) {
    p = p || {};
    var pes = p.pessoal || {}, neg = p.negocio || {}, sonhos = p.sonhos || [];
    var pesMes = soma(GRUPOS_PESSOAL.map(function (k) { return pes[k]; }));
    var negMes = soma(GRUPOS_NEGOCIO.map(function (k) { return neg[k]; }));
    var sonhosAno = soma(sonhos.map(function (s) { return s && s.valor; }));
    var pesAno = pesMes === null ? null : pesMes * 12;
    var negAno = negMes === null ? null : negMes * 12;
    var sub = (pesAno || 0) + (negAno || 0) + (sonhosAno || 0);
    var aliq = pct(p.aliquota);
    var estilo = null, erro = null;
    if (pesAno === null && negAno === null && sonhosAno === null) estilo = null;
    else if (aliq === null) erro = 'Informe a alíquota de imposto (linha 5).';
    else if (aliq >= 1 || aliq < 0) erro = 'A alíquota precisa ficar entre 0% e 99%.';
    else estilo = Math.round(sub / (1 - aliq));               // centavos
    return {
      pessoalMes: reais(pesMes), pessoalAno: reais(pesAno),
      negocioMes: reais(negMes), negocioAno: reais(negAno),
      sonhosAno: reais(sonhosAno), subtotal: reais(sub),
      aliquota: aliq, estiloVidaAno: reais(estilo),
      estiloVidaMes: estilo === null ? null : Math.round(estilo / 12) / 100,
      erro: erro
    };
  }

  // ---------- passo 3 ----------
  function passo3(p, estiloVidaAno) {
    p = p || {};
    var out = { erros: [] };
    var ev = num(estiloVidaAno), faixa = pct(p.faixa), ticket = num(p.ticket), perc = pct(p.percTransacao), conv = pct(p.conversao);
    out.estiloVida = ev; out.faixa = faixa; out.ticket = ticket; out.percTransacao = perc; out.conversao = conv;
    if (ev !== null && faixa) out.comissaoBruta = Math.round(ev / faixa * 100) / 100;
    else { out.comissaoBruta = null; if (!faixa) out.erros.push('Escolha a sua faixa de comissionamento (linha 2).'); }
    if (ticket !== null && perc !== null) out.comissaoMedia = Math.round(ticket * perc * 100) / 100;
    else { out.comissaoMedia = null; if (ticket === null) out.erros.push('Informe o ticket médio (linha 4).'); if (perc === null) out.erros.push('Informe o percentual de comissão por transação (linha 5).'); }
    if (out.comissaoBruta !== null && out.comissaoMedia) {
      out.transacoesExatas = out.comissaoBruta / out.comissaoMedia;
      out.transacoes = Math.ceil(out.transacoesExatas - 1e-9);   // book: 27,16 -> 28 (sempre para cima)
    } else out.transacoes = null;
    if (out.transacoes !== null && conv) {
      out.captacoesExatas = out.transacoes / conv;
      out.captacoes = roundHalfUp(out.captacoesExatas);         // book: 127,27 -> 127
      out.captacoesMes = roundHalfUp(out.captacoes / 12);         // book: 10,58 -> 11
      out.captacoesMesExatas = out.captacoes / 12;
    } else { out.captacoes = null; out.captacoesMes = null; if (!conv) out.erros.push('Informe a conversão das captações (linha 2 da p.29).'); }
    if (out.comissaoBruta !== null) { out.clube = clube(out.comissaoBruta); out.proximoClube = proximoClube(out.comissaoBruta); }
    return out;
  }

  // carteira (p.30): captações/mês × meses na carteira ≈ CREs ativas
  function carteira(captacoesMes, mesesNaCarteira) {
    var c = num(captacoesMes), m = num(mesesNaCarteira);
    if (c === null || m === null) return null;
    var cres = Math.round(c * m * 10) / 10;
    return { cresAtivas: cres, situacao: reguaCRE(cres), alerta: cres > 18 ? 'Passou de 18: o plano pede conversão maior, ticket maior ou estrutura de apoio — não só mais captação.' : null };
  }

  // metas mês a mês (p.31): estoque = inicial + novos − cancelados/expirados − vendidos
  function metasMensais(m) {
    m = m || {};
    var ini = num(m.cresIniciais) || 0, est = [], acum = ini, linhas = ['novas', 'perdidas', 'vendidas', 'transCaptacao', 'transVenda', 'comissaoMedia'];
    var tot = {}; linhas.forEach(function (l) { tot[l] = 0; });
    var vgc = [], trans = [];
    for (var i = 0; i < 12; i++) {
      var g = function (l) { return num((m[l] || [])[i]) || 0; };
      acum = acum + g('novas') - g('perdidas') - g('vendidas'); est.push(Math.round(acum * 100) / 100);
      var t = g('transCaptacao') + g('transVenda'); trans.push(t);
      vgc.push(Math.round(t * g('comissaoMedia') * 100) / 100);
      linhas.forEach(function (l) { tot[l] += g(l); });
    }
    return { estoque: est, transacoes: trans, vgc: vgc, totalTransacoes: trans.reduce(function (a, b) { return a + b; }, 0), totalVGC: Math.round(vgc.reduce(function (a, b) { return a + b; }, 0) * 100) / 100, totais: tot, estoqueFinal: est[11] };
  }

  // funil (p.36): de trás para frente
  function funil(f) {
    f = f || {};
    var cres = num(f.cresMes), v2cre = pct(f.taxaV2paraCRE), v1v2 = pct(f.taxaV1paraV2);
    var v2 = cres !== null && v2cre ? cres / v2cre : null;
    var v1 = v2 !== null && v1v2 ? v2 / v1v2 : null;
    var contatosSem = v1 !== null ? v1 / 4 : null;
    var r = function (x) { return x === null ? null : Math.ceil(x - 1e-9); };
    return { v2Mes: r(v2), v1Mes: r(v1), contatosSemana: r(contatosSem) };
  }

  function autoavaliacao(notas) {

    p4: function (t) { var r = t.ag.regioes || []; return bloco('Onde cada um vai jogar em 2027', r.length ? '<div class="cards">' + r.map(function (x) { return '<div class="cr"><h4>' + esc(x.nome) + '</h4><div style="font-size:18px">' + esc(x.regiao || '—') + '</div><small class="sub">' + esc(x.tipo || '') + '</small></div>'; }).join('') + '</div>' : '<p class="sub">Aguardando…</p>', 3); },
    p5: function (t) { var a = t.ag, h = a.horas || {}; return bloco('Semana padrão média da equipe (horas)', barras({ 'Prospecção': h.prosp || 0, 'Visitas ao proprietário': h.visProp || 0, 'Comprador': h.atend || 0, 'Acompanhamento': h.acomp || 0 })) + bloco('Canais de marketing escolhidos', barras(a.canais)) + bloco('Dia da revisão de estoque', barras(a.diaRev)) + bloco('Pessoas no CRM da equipe', grande(nfmt(a.crmHoje, 0) + ' → ' + nfmt(a.crmMeta, 0), 'hoje → meta para o fim de 2027'), 3); },
    p6: function (t) { var a = t.ag; return bloco('Cadência com o broker', barras(a.cadencia)) + bloco('Planos aceitos', grande(t.contagem.aceitos + ' / ' + t.contagem.total), 2); },
    trilha: function (t) { var n = t.ag.novos || []; return bloco('Primeiros 90 dias: datas-alvo', n.length ? n.map(function (x) { return '<div class="l" style="font-size:22px"><span>' + esc(x.nome) + '</span><b>1ª CRE ' + esc(dataBR(x.dataCRE)) + ' · 1ª venda ' + esc(dataBR(x.dataVenda)) + '</b></div>'; }).join('') : '<p class="sub">Aguardando…</p>', 3); },
    fechamento: function (t) { return PAINEIS.p3(t); }
  };
  function dataBR(s) { return s && /^\d{4}-\d{2}-\d{2}$/.test(s) ? s.slice(8, 10) + '/' + s.slice(5, 7) : '—'; }
  function telao() {
    app.innerHTML = '<div class="tvstage" id="tvstage"><div class="tv" id="tv"><p class="sub">Carregando o telão…</p></div></div>';
    // tela inteira sempre: o conteúdo é montado em 1920 px e encolhe até caber na TV (nada corta)
    var encaixa = function () { var tv = $('#tv'); if (!tv) return; tv.style.transform = 'none'; var h = tv.scrollHeight, w = 1920; var k = Math.min(window.innerWidth / w, window.innerHeight / h); tv.style.transform = 'scale(' + k + ')'; var st = $('#tvstage'); st.style.height = window.innerHeight + 'px'; tv.style.marginLeft = Math.max(0, (window.innerWidth - w * k) / 2) + 'px'; };
    window.addEventListener('resize', encaixa);
    var giro = ['abertura', 'diag', 'p3', 'p2', 'p1', 'p5', 'p4'], gi = 0, ultimo = null;
    var desenha = function (t) {
      var et = t.etapa === 'auto' ? giro[gi++ % giro.length] : t.etapa;
      var nomeEt = (ETAPAS.filter(function (x) { return x[0] === et; })[0] || [])[1] || '';
      var c = t.corretores.slice().sort(function (a, b) { return (b.vgcMeta || 0) - (a.vgcMeta || 0); });
      var maxV = Math.max.apply(null, c.map(function (x) { return x.vgcMeta || 0; }).concat([1]));
      $('#tv').innerHTML = '<div style="display:flex;align-items:center;gap:14px"><span class="logo" style="font-size:28px">RE/<span>MAX</span> Inovelar</span><h1 style="margin:0">Agent Summit · ' + esc(nomeEt) + '</h1>' + (t.pagina ? '<span class="chip" style="font-size:16px">📖 book ' + rotPag(t.pagina) + '</span>' : '') + '<span class="salvo">ao vivo · ' + esc(String(t.atualizado).slice(11, 16)) + '</span></div>' +
        '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">' + (PAINEIS[et] || PAINEIS.abertura)(t) + '</div>' +
        '<div class="cards">' + c.map(function (x) { var st = x.status === 'aceito' ? '<span class="chip aceito">✓ aceito</span>' : x.status === 'rascunho' ? '<span class="chip rascunho">preenchendo · ' + (x.pct || 0) + '%</span>' : '<span class="chip nao">ainda não começou</span>'; return '<div class="cr ' + x.status + '"><h4>' + esc(x.nome) + '</h4>' + st + '<div class="bar"><i style="width:' + Math.round((x.vgcMeta || 0) / maxV * 100) + '%"></i></div><div class="l"><span>VGC 2027</span><b style="' + corVGC(x.vgcMeta) + '">' + (x.vgcMeta ? brl(x.vgcMeta, 0) : '—') + '</b></div>' + (x.vgcMeta && x.vgcMeta < EXEC_MIN ? '<div class="l" style="color:var(--er);font-size:13px">abaixo de qualquer clube</div>' : '') + '<div class="l"><span>Transações · captações</span><b>' + (x.transacoes || '—') + ' · ' + (x.captacoes || '—') + '</b></div><div class="l"><span>Clube</span><b>' + esc(x.clube || '—') + '</b></div></div>'; }).join('') + '</div>';
      encaixa(); setTimeout(encaixa, 300);
    };
    var pinta = function () { chamar('telao', [S.token]).then(function (t) { aplicaConfig(t.config); ultimo = t; desenha(t); }).catch(function (e) { if (/Sessão|acesso/.test(e.message)) { ls('mp27_token', null); ls('mp27_gestor', null); return telaLogin('Entre para abrir o telão.'); } toast(e.message); }); };
    pinta(); setInterval(pinta, 15000); setInterval(function () { if (ultimo && ultimo.etapa === 'auto') desenha(ultimo); }, 20000);
  }

  // ================= ADMIN (planos, etapa do telão, mensagens) =================
  function topoGestor(titulo) {
    return '<div class="top"><div class="in"><span class="logo">RE/<span>MAX</span></span><b>' + titulo + '</b><span class="salvo"><a href="?v=admin">Administração</a> · <a href="?v=telao" target="_blank">Telão ›</a> · <a href="?v=acessos">Acessos</a> · <a href="#" id="sair">Sair</a></span></div></div>';
  }
  function admin() {
    app.innerHTML = topoGestor('Meu Plano 2027 · Administração') + '<div class="wrap adm" id="adm"><p class="sub">Carregando…</p></div>';
    $('#sair').onclick = function (e) { e.preventDefault(); sair(); };
    var pinta = function () {
      chamar('admin', [S.token]).then(function (a) {
        aplicaConfig(a.config); var t = a.telao;
        $('#adm').innerHTML = '<h1>Visão geral</h1><div class="cock">' + '<div class="k"><small>Aceitos · preenchendo</small><b>' + t.contagem.aceitos + ' · ' + t.contagem.preenchendo + ' de ' + t.contagem.total + '</b></div><div class="k"><small>VGC 2027 (soma das metas)</small><b>' + brl(t.totais.vgcMeta, 0) + '</b></div><div class="k"><small>Últimos 12 meses (iList)</small><b>' + brl(t.totais.vgc12m, 0) + '</b></div><div class="k"><small>Estilo de vida (soma)</small><b>' + brl(t.totais.estiloVida, 0) + '</b></div></div>' +
          '<h2>A sala está no book em</h2><div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn sec" id="pgMenos">‹</button><b style="font-size:28px;color:var(--ac)" id="pgAtual">' + rotPag(t.pagina || 0) + '</b><button class="btn sec" id="pgMais">›</button><input id="pgNum" type="text" inputmode="numeric" placeholder="nº da página" style="width:140px"><button class="btn" id="pgIr">Levar a turma</button></div><p class="sub">Todo corretor com o app aberto vai para esta página (quem estiver folheando vê o botão “Ir para a página da turma”). Mudar a etapa abaixo também leva o book para o início da etapa.</p></div>' +
          '<h2>O telão está mostrando</h2><div class="card"><div class="pill">' + ETAPAS.map(function (e) { return '<label><input type="radio" name="et" value="' + e[0] + '"' + (t.etapa === e[0] ? ' checked' : '') + '><span>' + e[1] + '</span></label>'; }).join('') + '</div><p class="sub">Troque conforme a sala avança no book. Em “Automático” o telão gira sozinho a cada 20 segundos.</p></div>' +
          '<h2>Planos dos corretores</h2><table><tr><th>Corretor</th><th>Situação</th><th>Metas</th><th></th></tr>' + a.corretores.filter(function (c) { return c.ativo; }).map(function (c) {
            var p = c.plano, r = p && p.dados && p.dados.__resumo || {};
            var st = !p ? '<span class="chip nao">não começou</span>' : p.status === 'aceito' ? '<span class="chip aceito">aceito ' + esc(String(p.aceiteEm).slice(0, 10)) + '</span>' : '<span class="chip rascunho">' + esc(p.passo || '') + ' · ' + (p.pct || 0) + '%</span>';
            return '<tr><td><b>' + esc(c.nome) + '</b></td><td>' + st + (p ? '<br><small class="sub">' + esc(p.atualizado) + '</small>' : '') + '</td><td>' + (r.vgcMeta ? 'VGC <b style="' + corVGC(r.vgcMeta) + '">' + brl(r.vgcMeta, 0) + '</b>' + (r.vgcMeta < EXEC_MIN ? ' <small style="color:var(--er)">sem clube</small>' : '') + '<br>' + r.transacoes + ' trans. · ' + r.captacoes + ' capt.' + (r.nivel ? '<br><small class="sub">' + esc(r.nivel) + '</small>' : '') : '—') + '</td><td><select data-ac="' + esc(c.email) + '"><option value="">Ações…</option>' + (p ? '<option value="ver">Ver plano completo</option>' : '') + '<option value="como">Ver como ele vê</option><option value="msg">Mensagem pronta</option>' + (p && p.status === 'aceito' ? '<option value="reabrir">Reabrir plano</option>' : '') + '</select></td></tr>';
          }).join('') + '</table><div id="det"></div>';
        S.adm = a;
        $$('input[name=et]').forEach(function (r) { r.onchange = function () { var pg = PAG_ETAPA[r.value]; chamar('adminEtapa', [S.token, r.value, pg === undefined ? null : pg]).then(function (x) { $('#pgAtual').textContent = rotPag(x.pagina); toast('Telão: ' + r.parentNode.textContent + (pg !== undefined ? ' · book ' + rotPag(pg) : '')); }).catch(function (e) { toast(e.message); }); }; });
        var pgSet = function (p) { p = Math.max(0, Math.min(BOOK_TOTAL - 1, p)); chamar('adminEtapa', [S.token, null, p]).then(function (x) { t.pagina = x.pagina; $('#pgAtual').textContent = rotPag(x.pagina); toast('Turma levada para a ' + rotPag(x.pagina)); }).catch(function (e) { toast(e.message); }); };
        $('#pgMenos').onclick = function () { pgSet((t.pagina || 0) - 1); }; $('#pgMais').onclick = function () { pgSet((t.pagina || 0) + 1); };
        $('#pgIr').onclick = function () { var n = parseInt($('#pgNum').value, 10); if (isNaN(n)) return toast('Digite o número da página impressa no book.'); pgSet(n); };
        $$('[data-ac]').forEach(function (s) { s.onchange = function () { var v = s.value, em = s.getAttribute('data-ac'); s.value = ''; acaoAdmin(v, em, pinta); }; });
      }).catch(function (e) { if (/Sessão|acesso|administrador/.test(e.message)) { ls('mp27_token', null); ls('mp27_gestor', null); return telaLogin(e.message); } toast(e.message); });
    };
    pinta();
  }

  // ================= ACESSOS (ativar/desativar, códigos, links) =================
  function acessos() {
    app.innerHTML = topoGestor('Meu Plano 2027 · Acessos') + '<div class="wrap adm" id="ac"><p class="sub">Carregando…</p></div>';
    $('#sair').onclick = function (e) { e.preventDefault(); sair(); };
    var pinta = function () {
      Promise.all([chamar('admin', [S.token]), chamar('adminCodigo', [S.token])]).then(function (x) {
        var a = x[0], cods = x[1], ks = Object.keys(cods);
        S.adm = a;
        $('#ac').innerHTML = '<h1>Acessos</h1><div class="cock"><div class="k"><small>E-mails que ainda posso enviar hoje</small><b>' + a.cotaEmail + '</b></div><div class="k"><small>Corretores ativos</small><b>' + a.corretores.filter(function (c) { return c.ativo; }).length + '</b></div></div>' +
          '<h2>Códigos pedidos nos últimos 15 minutos</h2><div class="card">' + (ks.length ? ks.map(function (e) { return '<div class="row"><span>' + esc(e) + '<small>' + esc(cods[e].h) + '</small></span><b class="codigo" style="font-size:22px">' + esc(cods[e].c) + '</b></div>'; }).join('') : '<p class="sub" style="margin:0">Nenhum código pendente. A lista atualiza sozinha.</p>') + '</div>' +
          '<h2>Corretores</h2><table><tr><th>Corretor</th><th>Acesso</th><th></th></tr>' + a.corretores.map(function (c) {
            return '<tr><td><b>' + esc(c.nome) + '</b><br><small class="sub">' + esc(c.email || 'sem e-mail') + '</small>' + (c.obs ? '<br><small class="sub">' + esc(c.obs) + '</small>' : '') + '</td><td>' + (c.ativo ? '<span class="chip aceito">ativo</span>' : '<span class="chip nao">desativado</span>') + '</td><td>' + (c.email ? '<div class="btns" style="margin:0"><button class="btn sec" data-tg="' + esc(c.email) + '" data-at="' + (c.ativo ? 1 : 0) + '">' + (c.ativo ? 'Desativar' : 'Ativar') + '</button>' + (c.ativo ? '<button class="btn sec" data-lk="' + esc(c.email) + '">Link de entrada</button>' : '') + '</div>' : '') + '</td></tr>';
          }).join('') + '</table><div id="det"></div>' +
          '<h2>Incluir corretor</h2><div class="card"><div class="grid2"><input id="nNome" placeholder="Nome (igual ao do iList, para puxar o diagnóstico)"><input id="nEmail" type="email" placeholder="E-mail"></div><div class="btns"><button class="btn" id="bInc">Incluir</button></div></div>';
        $$('[data-tg]').forEach(function (b) { b.onclick = function () { var em = b.getAttribute('data-tg'), at = b.getAttribute('data-at') === '1'; if (at && !confirm('Desativar o acesso de ' + em + '? Ele sai do app e do telão na hora.')) return; chamar('adminCorretor', [S.token, at ? 'desativar' : 'reativar', { email: em }]).then(function () { toast('Feito.'); pinta(); }).catch(function (e) { toast(e.message); }); }; });
        $$('[data-lk]').forEach(function (b) { b.onclick = function () { acaoAdmin('link', b.getAttribute('data-lk'), pinta); }; });
        $('#bInc').onclick = function () { chamar('adminCorretor', [S.token, 'incluir', { nome: $('#nNome').value, email: $('#nEmail').value }]).then(function (r) { toast('Corretor ' + r.ok + '.'); pinta(); }).catch(function (e) { toast(e.message); }); };
      }).catch(function (e) { if (/Sessão|acesso|administrador/.test(e.message)) { ls('mp27_token', null); ls('mp27_gestor', null); return telaLogin(e.message); } toast(e.message); });
    };
    pinta(); setInterval(function () { if (!document.activeElement || document.activeElement.tagName !== 'INPUT') pinta(); }, 15000);
  }
  function msgPronta(c) {
    var p = c.plano, n = c.nome.split(' ')[0];
    if (!p) return 'Oi, ' + n + '! O Meu Plano 2027 do Agent Summit já está no ar. Entre com o seu e-mail em ' + location.origin + location.pathname + ' — leva uns 50 minutos e salva sozinho. Conto com você!';
    if (p.status !== 'aceito') return 'Oi, ' + n + '! Vi que você já está em ' + (p.passo || 'andamento') + ' (' + (p.pct || 0) + '%) no Meu Plano 2027. Bora terminar e dar o aceite? Qualquer dúvida, chama.';
    var r = p.dados.__resumo || {}; return 'Parabéns, ' + n + '! Seu plano 2027 está aceito: ' + (r.transacoes || '') + ' transações e VGC de ' + brl(r.vgcMeta, 0) + (r.clube ? ' (' + r.clube + ')' : '') + '. Agora é execução — vamos juntos!';
  }
  function acaoAdmin(v, email, pinta) {
    var c = S.adm.corretores.filter(function (x) { return x.email === email; })[0]; if (!v || !c) return;
    if (v === 'msg') { var m = msgPronta(c); $('#det').innerHTML = '<div class="card"><b>Mensagem para ' + esc(c.nome) + '</b><textarea id="tmsg">' + esc(m) + '</textarea><div class="btns"><button class="btn" id="bcp">Copiar</button><a class="btn sec" target="_blank" href="https://wa.me/?text=' + encodeURIComponent(m) + '">Abrir no WhatsApp</a></div></div>'; $('#bcp').onclick = function () { $('#tmsg').select(); document.execCommand('copy'); toast('Copiado!'); }; $('#det').scrollIntoView(); return; }
    if (v === 'link') { chamar('adminLink', [S.token, email]).then(function (r) { var u = location.origin + location.pathname + '?t=' + encodeURIComponent(r.token); $('#det').innerHTML = '<div class="card"><b>Link de entrada de ' + esc(c.nome) + '</b><p class="sub">Entra direto, sem código. Mande só para ele.</p><textarea>' + esc(u) + '</textarea></div>'; $('#det').scrollIntoView(); }).catch(function (e) { toast(e.message); }); return; }
    if (v === 'como') { window.open(location.pathname + '?v=como&c=' + encodeURIComponent(c.nome), '_blank'); return; }
    if (v === 'ver') { var D = c.plano.dados; S.D = D; S.eu = { nome: c.nome }; var r = calc(); $('#det').innerHTML = '<h2>Plano de ' + esc(c.nome) + '</h2>' + cockpit(r) + '<div class="card"><h3 style="margin-top:0">Estilo de vida (só administradores)</h3>' + RES.p2(r) + '<h3>Sonhos</h3>' + (D.passo2.sonhos || []).filter(function (s) { return s && s.nome; }).map(function (s) { return '<p>' + esc(s.nome) + ' · ' + brl(s.valor, 0) + '</p>'; }).join('') + '</div><div class="card"><h3 style="margin-top:0">Teste de realidade</h3>' + RES.real(r) + '</div>'; $('#det').scrollIntoView(); return; }
    if ((v === 'desativar' || v === 'reabrir') && !confirm((v === 'desativar' ? 'Desativar ' : 'Reabrir o plano de ') + c.nome + '?')) return;
    chamar('adminCorretor', [S.token, v, { email: email }]).then(function () { toast('Feito.'); pinta(); }).catch(function (e) { toast(e.message); });
  }

  window.addEventListener('error', function (e) { try { console.error(e); } catch (x) {} });
  window.__mp27 = { S: S, B: B, calc: calc, textoClaude: textoClaude, VERSAO_TELA: VERSAO_TELA };
  iniciar();
})();
</script>
