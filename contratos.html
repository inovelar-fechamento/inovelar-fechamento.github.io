<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b16">
<title>Contratos · RE/MAX Inovelar</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b16;color:#e6ecff;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:#2fe4ff}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 120px}
.logo{font-weight:800;font-size:20px;letter-spacing:.4px}.logo span{color:#e11b22}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.quem{color:#8fa0c8;font-size:13px}
h1{font-size:22px;margin:10px 0 2px}h2{font-size:18px;margin:0 0 8px}
.sub{color:#8fa0c8;font-size:14px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:120px;background:#0e1528;color:#b9c6ea;border:1px solid #22305a;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
.tabs button.on{background:#2fe4ff;color:#04121c;border-color:#2fe4ff}
.card{background:#0e1528;border:1px solid #22305a;border-radius:14px;padding:14px;margin-top:12px}
.sec{margin-top:16px}.sec>h2{display:flex;justify-content:space-between;align-items:center}
label.f{display:block;margin-top:12px;font-size:14px;color:#b9c6ea}
label.f b{color:#ff8a8a;font-weight:700}
.h{display:block;color:#6f80a8;font-size:12px;margin-top:2px}
input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid #22305a;background:#070b16;color:#e6ecff;font-size:16px;margin-top:5px;font-family:inherit}
textarea{min-height:76px;resize:vertical}
input.ia,textarea.ia{border-color:#d9a400;background:#1b1606}
.tagia{display:inline-block;margin-left:6px;font-size:11px;color:#ffd666;background:#3a2d05;border-radius:6px;padding:1px 6px}
input.falta,textarea.falta,select.falta{border-color:#ff5a5a}
.btn{display:inline-block;padding:11px 14px;border:0;border-radius:10px;background:#2fe4ff;color:#04121c;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.btn.sec2{background:#1a2546;color:#cfe0ff;border:1px solid #2b3b6e}
.btn.red{background:#3a1216;color:#ffb3b3;border:1px solid #6a2228}
.btn.verde{background:#19e68c;color:#03160c}
.btn:disabled{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.tipo{background:#0e1528;border:2px solid #22305a;border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:#e6ecff}
.tipo b{display:block;font-size:17px}.tipo span{color:#8fa0c8;font-size:13px}
.tipo.on{border-color:#2fe4ff;background:#0b2233}
.docs{background:#0b1f2a;border:1px dashed #2fe4ff;border-radius:12px;padding:12px;margin-top:10px}
.docs p{margin:0 0 8px;font-size:14px;color:#cfe9ff}
.docs input[type=file]{border:0;padding:0;background:none}
.docmsg{font-size:13px;color:#9fe8ff;margin-top:6px;white-space:pre-line}
.op{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.op{grid-template-columns:1fr}}
.op .card{margin-top:0}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;background:#1a2546;color:#cfe0ff}
.st.rascunho{background:#2a2410;color:#ffe4a3}.st.liberado{background:#0f3324;color:#7dffc2}.st.ajuste{background:#3a1216;color:#ffb3b3}
.st.conferencia,.st.decisao{background:#132a4a;color:#9fd0ff}
.item{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.item .r{font-size:14px;color:#b9c6ea;margin-top:4px}
.salvo{position:fixed;left:0;right:0;bottom:0;background:#0a1122ee;border-top:1px solid #22305a;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:5}
.salvo .s{color:#8fa0c8;font-size:13px}
.aviso{background:#2a2410;border:1px solid #5a4a18;color:#ffe4a3;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.ok{background:#0f3324;border:1px solid #1f6b4a;color:#b9ffe0;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:9;padding:20px 10px}
.modal .card{max-width:640px;width:100%}
.kv{font-size:14px;border-bottom:1px solid #1a2546;padding:6px 0}.kv i{color:#8fa0c8;font-style:normal;display:block;font-size:12px}
.login{max-width:400px;margin:40px auto}
input.cod{font-size:28px;letter-spacing:8px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app">Carregando…</div>
<script>
/* Contratos Inovelar (v1 — 21/11/2026). Entrada do corretor para o contrato de compra e venda.
   Mesmo login da Avaliação (e-mail + código; o aparelho fica conectado). Rascunho salvo sozinho.
   Ao enviar, os dados vão para a mesma planilha do formulário antigo e a rotina gera o contrato pelo modelo vigente do Jurídico.
   O PDF vai primeiro para a gestão (Brenno e Andréia), que libera para o corretor ou pede ajuste. */
(function(){
var API="https://script.google.com/macros/s/AKfycbzKz04E4xTJSUYgh7cJoSKHgYD4uynC_-4eTHU7zHvU9dZF0YK6NnUVxdKEi-kA7LY5/exec", LS="inovelar_av_k", LSE="inovelar_sh_email", LSR="inovelar_ct_rascunho";
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function $(s,r){return (r||document).querySelector(s);} function $$(s,r){return [].slice.call((r||document).querySelectorAll(s));}
function post(fn,args,t){t=t||0;return fetch(API,{method:"POST",body:JSON.stringify({fn:fn,args:args||[]}),credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"}})
  .then(function(r){return r.json();}).then(function(j){if(j&&j.e!==undefined){var e=new Error(j.e);e.srv=1;throw e;}return j?j.r:null;})
  .catch(function(e){if(e.srv||t>=2)throw e;return new Promise(function(ok){setTimeout(ok,1500);}).then(function(){return post(fn,args,t+1);});});}
var APP=$("#app"), K=null, EU=null, S={aba:"meus",id:null,tipo:null,d:{},nv:1,nc:1,ia:{},sujo:false,salvando:false,lista:[]};

/* ---------- campos (iguais ao formulário "Briefing de contrato de compra e venda") ---------- */
var IMOVEL=[["ID do imóvel no iList","O código do anúncio, ex.: 880391012-149.",1],["Endereço completo do imóvel","Quadra, conjunto, lote, bloco, apartamento, cidade.",1],["CEP do imóvel","Formato 00000-000.",1],
 ["Número da matrícula","",1],["Cartório de registro","Ex.: 6º Ofício de Registro de Imóveis do DF.",1],["Inscrição do IPTU","",1],["Matrícula da CAESB","",1],["Unidade consumidora da Neoenergia","",1],
 ["Itens que permanecem no imóvel","Armários, bancada, split, cortinas, luminárias. Se não fica nada, escreva \"nada\".",1,"area"]];
var PESSOA=[["nome completo","Exatamente como está no documento.",1],["nacionalidade","",1],["estado civil","Se casado, informe também o regime de bens.",1],["profissão","",1],["data de nascimento","",1,"date"],
 ["RG e órgão emissor","Ex.: 1.234.567 SSP/DF.",1],["CPF","Formato 000.000.000-00. Confira dígito por dígito.",1],["endereço completo","",1],["CEP","Formato 00000-000.",1],["e-mail","",1,"email"],["telefone","",1,"tel"]];
var PRECO=[["Valor total da venda","Em reais. Ex.: 399.900,00",1],["Valor do sinal","Em reais. Se não houver sinal, escreva 0.",1],["Data limite para o pagamento do sinal","Se não houver sinal, repita a data de hoje.",0,"date"]];
var FIN=[["Banco do financiamento","",1],["Valor financiado","Em reais. Somado ao sinal tem que dar o valor total.",1],["Em que etapa está o financiamento?","Ex.: aprovado, em análise, aguardando avaliação.",0]];
var VISTA=[["Formato do pagamento à vista","Mesmo sendo à vista, o pagamento pode ter formatos diferentes.",1,"sel",["100% à vista no dia da escritura (sem sinal)","Sinal na assinatura + restante no dia da escritura","Sinal para quitar o financiamento/dívida do imóvel + restante no dia da escritura","Outro formato (descreva abaixo)"]],
 ["Como e quando o pagamento será feito","Descreva como e quando cada valor será pago: sinal (valor e data), quitação do financiamento, restante na escritura, conta para depósito.",1,"area"],
 ["Financiamento ou dívida a quitar (se houver)","Banco credor, nº do contrato e saldo devedor aproximado. Deixe em branco se o imóvel não tem dívida.",0,"area"],
 ["Valor das arras","Parte do sinal que vale como garantia do negócio (ex.: R$ 35.000 = 10% do valor). No formato 100% na escritura, informe o % da multa se alguém desistir.",0],
 ["O comprador já mora no imóvel como inquilino?","",1,"sel",["Não","Sim"]]];
var PARC=[["Como o saldo fica garantido?","A garantia do saldo é decisão da direção da loja — confirme com o Brenno antes de responder.",1,"sel",["Parcelamento declarado na escritura pública","Escritura retida até a última parcela","Alienação fiduciária na matrícula","Ainda não definido — o Brenno vai decidir"]],
 ["Quantidade de parcelas","",1],["Valor de cada parcela","Em reais. Se as parcelas forem diferentes, descreva.",1],["Periodicidade e data da primeira parcela","Ex.: mensais, a primeira em 10/11/2026.",1],["Índice de correção das parcelas","Ex.: IPCA, IGP-M, sem correção.",1],["Juros e multa por atraso","Ex.: multa de 2% e juros de 1% ao mês.",1]];
var COM=[["Conta do vendedor para receber o líquido","Banco, agência, conta e PIX.",1],["Percentual da comissão","Ex.: 6%",1],["Divisão da comissão","Ex.: 45% corretor parceiro / 55% imobiliária.",1],
 ["Quem paga a comissão?","",1,"sel",["Os compradores","Os vendedores","Dividida entre as partes"]],["Corretor parceiro — nome e CRECI","Se não houver, escreva \"não há\".",1],["Entrega das chaves e posse","Data ou condição. Ex.: na assinatura da escritura.",1],
 ["Débitos do imóvel até a posse ficam por conta de quem?","",1,"sel",["Vendedores","Compradores"]],["Despesas de transferência (ITBI, escritura, registro) por conta de quem?","",1,"sel",["Compradores","Vendedores","Divididas"]],
 ["Algo mais que o contrato precise dizer","Combinações específicas deste negócio. Se não houver, deixe em branco.",0,"area"]];
var TIPOS={fin:["Financiamento bancário","Sinal + financiamento (inclui FGTS e carta de consórcio)"],vista:["À vista","Pagamento à vista, com ou sem sinal"],parc:["Parcelado direto com o vendedor","Saldo em parcelas — a garantia é decisão da gestão"]};
var ORD=["Primeiro","Segundo","Terceiro"], EXT={2:["segundo","Não, só um"],3:["terceiro","Não, só dois"]};

/* ---------- login (igual à Avaliação) ---------- */
function telaLogin(msg){
  /* desde 21/11/2026 o login é um só, nos Apps Inovelar (acessos.html) */
  if(location.protocol!=="file:"){location.replace("acessos.html?volta=contratos.html"+(msg?"&msg="+encodeURIComponent(msg):""));return;}
  APP.innerHTML='<div class="login"><div class="logo">RE/<span>MAX</span> Inovelar</div><h1>Contratos</h1><p class="sub">Pedido de contrato de compra e venda</p>'+(msg?'<div class="aviso">'+esc(msg)+'</div>':'')+
   '<div class="card" id="pE"><label class="f">Seu e-mail</label><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="seuemail@remax.com.br" value="'+esc(ls(LSE)||"")+'"><div class="row"><button class="btn" id="bE" style="width:100%">Receber código</button></div></div>'+
   '<div class="card hide" id="pC"><label class="f">Digite o código de 6 números que chegou no seu e-mail</label><input id="cod" class="cod" inputmode="numeric" autocomplete="one-time-code" maxlength="7"><div class="row"><button class="btn" id="bC" style="width:100%">Entrar</button></div><p class="sub" style="margin-top:10px">Não chegou? Olhe o spam ou <a href="#" id="tr">pedir de novo</a>. O Brenno e a Andréia também conseguem ver o seu código.</p></div>'+
   '<p class="sub" style="margin-top:14px">Mesmo e-mail da Avaliação. Você entra uma vez neste aparelho e ele fica conectado.</p></div>';
  var em=$("#em"),bE=$("#bE"),bC=$("#bC"),cod=$("#cod");
  function aviso(t){var a=$(".aviso");if(!a){a=document.createElement("div");a.className="aviso";$(".login .sub").after(a);}a.textContent=t;}
  bE.onclick=function(){var e=em.value.trim().toLowerCase();if(!e)return em.focus();bE.disabled=true;bE.textContent="Enviando…";
    post("pedirCodigoEntrada",[e]).then(function(r){if(!r||!r.ok){aviso((r&&r.motivo)||"Não deu certo. Tente de novo.");return;}ls(LSE,e);$("#pE").classList.add("hide");$("#pC").classList.remove("hide");cod.focus();if(r.aviso)aviso(r.aviso);})
    .catch(function(){aviso("Sem conexão com o sistema. Confira a internet e tente de novo.");}).then(function(){bE.disabled=false;bE.textContent="Receber código";});};
  em.onkeydown=function(ev){if(ev.key==="Enter")bE.click();};
  $("#tr").onclick=function(ev){ev.preventDefault();$("#pC").classList.add("hide");$("#pE").classList.remove("hide");};
  bC.onclick=function(){bC.disabled=true;bC.textContent="Entrando…";
    post("entrarComCodigo",[em.value.trim().toLowerCase(),cod.value]).then(function(r){if(!r||!r.ok){aviso((r&&r.motivo)||"Não deu certo.");bC.disabled=false;bC.textContent="Entrar";return;}
      ls(LS,String(r.k).toUpperCase());iniciar(String(r.k).toUpperCase());})
    .catch(function(){aviso("Sem conexão com o sistema.");bC.disabled=false;bC.textContent="Entrar";});};
  cod.oninput=function(){if(cod.value.replace(/\D/g,"").length===6)bC.click();};
}
function iniciar(k){
  K=k; APP.innerHTML="Carregando…";
  post("ctInicio",[k]).then(function(r){EU=r;S.lista=r.lista||[];casca();
      var loc=null;try{loc=JSON.parse(ls(LSR)||"null");}catch(e){}
      if(loc&&loc.tipo&&loc.pendente){abrirForm(loc.id,loc.tipo,loc.d,true);}else mostrar("meus");})
   .catch(function(e){if(/Acesso (não liberado|bloqueado)/i.test(e.message)){ls(LS,null);telaLogin(/bloqueado/i.test(e.message)?"Seu acesso está bloqueado. Fale com a gestão.":"Seu acesso mudou. Entre de novo com o seu e-mail.");}
     else APP.innerHTML='<div class="aviso">Não consegui abrir agora ('+esc(e.message)+').</div><p><a href="">Tentar de novo</a></p>';});
}

/* ---------- casca ---------- */
function casca(){
  APP.innerHTML='<div class="top"><div class="logo">RE/<span>MAX</span> Inovelar · Contratos</div><div class="quem">'+esc(EU.nome)+' · <a href="acessos.html">Apps Inovelar</a></div></div>'+
   '<div class="tabs"><button data-a="meus">Meus contratos</button><button data-a="novo">+ Novo contrato</button>'+(EU.gestao?'<button data-a="gestao">Gestão</button>':'')+'</div><div id="tela"></div><div class="salvo hide" id="barra"></div>';
  $$(".tabs button").forEach(function(b){b.onclick=function(){if(S.sujo){salvar().then(function(){mostrar(b.dataset.a);});}else mostrar(b.dataset.a);};});
}
function mostrar(a){S.aba=a;$$(".tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.a===a);});$("#barra").classList.add("hide");
  if(a==="meus")telaMeus();else if(a==="novo")telaTipo();else telaGestao();window.scrollTo(0,0);}
var NOMEST={rascunho:"Rascunho",enviado:"Enviado",conferencia:"Em conferência",decisao:"Aguardando a gestão",problema:"Em conferência",ajuste:"Ajuste pedido",liberado:"Liberado"};
function telaMeus(){
  var T=$("#tela"); T.innerHTML='<p class="sub">Seus pedidos de contrato. O rascunho fica salvo sozinho; continue de onde parou ou reaproveite os dados de um contrato anterior.</p><div id="ls">Atualizando…</div>';
  post("ctInicio",[K]).then(function(r){S.lista=r.lista||[];desenha();}).catch(function(){desenha();});
  function desenha(){var L=$("#ls");if(!L)return;
    if(!S.lista.length){L.innerHTML='<div class="card">Nenhum contrato ainda. Toque em <b>+ Novo contrato</b>.</div>';return;}
    L.innerHTML=S.lista.map(function(c){return '<div class="card"><div class="item"><div><span class="st '+c.status+'">'+(NOMEST[c.status]||c.status)+'</span> <b>'+esc(TIPOS[c.tipo]?TIPOS[c.tipo][0]:c.tipo)+'</b><div class="r">'+esc(c.resumo||"(sem dados ainda)")+'</div><div class="r">'+esc(c.txt)+'</div><div class="r" style="font-size:12px">'+esc(c.id)+' · atualizado '+esc(c.atualizado)+'</div></div></div><div class="row">'+
      ((c.status==="rascunho"||c.status==="ajuste")?'<button class="btn" data-c="'+c.id+'">Continuar</button>':'<button class="btn sec2" data-v="'+c.id+'">Ver dados</button>')+
      (c.status==="liberado"?'<button class="btn verde" data-p="'+c.id+'">Baixar PDF</button>':'')+
      '<button class="btn sec2" data-r="'+c.id+'">Reaproveitar dados</button>'+(c.status==="rascunho"?'<button class="btn red" data-x="'+c.id+'">Apagar</button>':'')+'</div></div>';}).join("");
    $$("[data-c]",L).forEach(function(b){b.onclick=function(){carregar(b.dataset.c,false);};});
    $$("[data-v]",L).forEach(function(b){b.onclick=function(){verDados(b.dataset.v);};});
    $$("[data-r]",L).forEach(function(b){b.onclick=function(){carregar(b.dataset.r,true);};});
    $$("[data-p]",L).forEach(function(b){b.onclick=function(){b.disabled=true;post("ctPdfCorretor",[K,b.dataset.p]).then(function(r){window.open(r.url,"_blank");}).catch(function(e){alert(e.message);}).then(function(){b.disabled=false;});};});
    $$("[data-x]",L).forEach(function(b){b.onclick=function(){if(!confirm("Apagar este rascunho?"))return;post("ctApagar",[K,b.dataset.x]).then(function(){telaMeus();}).catch(function(e){alert(e.message);});};});
  }
}
function carregar(id,copia){
  $("#tela").innerHTML="Abrindo…";
  post("ctAbrir",[K,id]).then(function(r){
    if(copia){var d=r.dados||{};delete d["ID do app"];delete d["Documentos (pasta)"];abrirForm(null,r.tipo,d);aviso("Dados copiados do contrato "+id+". Confira tudo e troque o que for diferente neste negócio.");}
    else abrirForm(r.id,r.tipo,r.dados);}).catch(function(e){$("#tela").innerHTML='<div class="aviso">'+esc(e.message)+'</div>';});
}
function verDados(id){
  post("ctAbrir",[K,id]).then(function(r){var d=r.dados||{};
    var m=document.createElement("div");m.className="modal";m.innerHTML='<div class="card"><div class="item"><h2>'+esc(TIPOS[r.tipo]?TIPOS[r.tipo][0]:"")+'</h2><button class="btn sec2" id="fx">Fechar</button></div><p class="sub">'+esc(r.txt)+'</p>'+
      Object.keys(d).filter(function(k){return d[k];}).map(function(k){return '<div class="kv"><i>'+esc(k)+'</i>'+esc(d[k])+'</div>';}).join("")+(r.pasta?'<p><a href="'+esc(r.pasta)+'" target="_blank">Pasta dos documentos</a></p>':'')+'</div>';
    document.body.appendChild(m);$("#fx",m).onclick=function(){m.remove();};}).catch(function(e){alert(e.message);});
}

/* ---------- novo: escolher o tipo ---------- */
function telaTipo(){
  $("#tela").innerHTML='<h1>Qual é o contrato?</h1><p class="sub">Escolha a forma de pagamento — é ela que define o modelo do Jurídico usado no contrato.</p><div class="tipos">'+
   Object.keys(TIPOS).map(function(t){return '<button class="tipo" data-t="'+t+'"><b>'+TIPOS[t][0]+'</b><span>'+TIPOS[t][1]+'</span></button>';}).join("")+'</div>'+
   '<div class="card" style="margin-top:14px"><b>Como funciona</b><p class="sub" style="margin:6px 0 0">1) Você preenche (ou envia os documentos e o sistema lê). 2) Tudo fica salvo sozinho. 3) Ao enviar, o contrato é montado pelo modelo vigente do Jurídico Inovelar. 4) O Brenno e a Andréia conferem e liberam o PDF para você — ou pedem ajuste.</p></div>';
  $$(".tipo").forEach(function(b){b.onclick=function(){abrirForm(null,b.dataset.t,{});};});
}

/* ---------- formulário ---------- */
function campo(key,help,req,tipo,ops){
  var v=S.d[key]==null?"":S.d[key], ia=S.ia[key]?' ia':'', id="f_"+btoa(unescape(encodeURIComponent(key))).replace(/[^A-Za-z0-9]/g,"");
  var lab='<label class="f" for="'+id+'">'+esc(key.replace(/^(Vendedor|Comprador) \d — /,""))+(req?' <b>*</b>':'')+(S.ia[key]?'<span class="tagia">lido do documento — confira</span>':'')+(help?'<span class="h">'+esc(help)+'</span>':'')+'</label>';
  var inp;
  if(tipo==="area")inp='<textarea id="'+id+'" data-k="'+esc(key)+'" class="'+ia+'">'+esc(v)+'</textarea>';
  else if(tipo==="sel")inp='<select id="'+id+'" data-k="'+esc(key)+'" class="'+ia+'"><option value="">— escolha —</option>'+ops.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>';}).join("")+'</select>';
  else inp='<input id="'+id+'" data-k="'+esc(key)+'" class="'+ia+'" type="'+(tipo==="date"?"date":tipo==="email"?"email":tipo==="tel"?"tel":"text")+'" value="'+esc(v)+'"'+(tipo==="tel"?' inputmode="tel"':'')+'>';
  return lab+inp;
}
function blocoDocs(papel,txt){return '<div class="docs" data-papel="'+esc(papel)+'"><p>📎 <b>Envie os documentos que eu leio</b> — '+txt+'</p><input type="file" multiple accept="image/*,application/pdf"><div class="docmsg"></div></div>';}
function pessoa(tipo,n){var pap=tipo+" "+n;
  return '<div class="card sec" data-pes="'+pap+'"><h2>'+pap+(n>1?' <button class="btn red" data-rm="'+tipo+'" style="padding:6px 10px;font-size:13px">Remover</button>':'')+'</h2><p class="sub">Exatamente como está no documento.</p>'+
   blocoDocs(pap,"RG ou CNH, comprovante de residência e, se casado(a), a certidão de casamento. Eu preencho o que conseguir ler e marco em amarelo para você conferir.")+
   PESSOA.map(function(c){return campo(pap+" — "+c[0],c[1],c[2],c[3]);}).join("")+'</div>';}
function abrirForm(id,tipo,d,doLocal){
  S.id=id;S.tipo=tipo;S.d=d||{};S.ia=S.d.__ia||{};delete S.d.__ia;S.sujo=false;
  S.nv=S.d["Existe um terceiro vendedor?"]==="Sim"?3:S.d["Existe um segundo vendedor?"]==="Sim"?2:1;
  S.nc=S.d["Existe um terceiro comprador?"]==="Sim"?3:S.d["Existe um segundo comprador?"]==="Sim"?2:1;
  if(!S.d["Seu nome completo"])S.d["Seu nome completo"]=EU.nome;
  if(!S.d["Seu CRECI"]&&ls("inovelar_ct_creci"))S.d["Seu CRECI"]=ls("inovelar_ct_creci");
  $$(".tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.a==="novo");});
  desenhaForm(); if(doLocal)aviso("Recuperei o que estava preenchido neste aparelho. Confira e continue.");
}
function desenhaForm(){
  var t=S.tipo, pag=t==="fin"?FIN:t==="vista"?VISTA:PARC, h="";
  h+='<h1>'+esc(TIPOS[t][0])+'</h1><p class="sub">Campos com <b style="color:#ff8a8a">*</b> são obrigatórios. Campo sem resposta vira pendência no contrato. Tudo fica salvo sozinho.</p>';
  h+='<div class="op"><div class="card"><b>Opção 1 — envie os documentos</b><p class="sub" style="margin:6px 0 0">Em cada parte (imóvel, vendedores, compradores) tem um quadro 📎. Mande as fotos ou PDFs: eu leio e preencho os campos vazios, em amarelo, para você conferir.</p></div><div class="card"><b>Opção 2 — preencha os campos</b><p class="sub" style="margin:6px 0 0">Se preferir, digite direto nos campos abaixo. Pode misturar: ler os documentos e completar à mão.</p></div></div>';
  if(t==="parc")h+='<div class="aviso">O modelo do parcelado direto ainda depende de decisão da gestão sobre a garantia do saldo. Pode preencher e enviar: o Brenno decide e o contrato sai depois.</div>';
  h+='<div class="card sec"><h2>Você</h2>'+campo("Seu nome completo","",1)+campo("Seu CRECI","",1)+'</div>';
  h+='<div class="card sec"><h2>O imóvel</h2><p class="sub">Os dados do cadastro e das contas. Sem eles o contrato sai com lacuna.</p>'+blocoDocs("Imóvel","matrícula, carnê do IPTU, conta da CAESB e da Neoenergia.")+IMOVEL.map(function(c){return campo(c[0],c[1],c[2],c[3]);}).join("")+'</div>';
  for(var i=1;i<=S.nv;i++)h+=pessoa("Vendedor",i);
  if(S.nv<3)h+='<div class="row"><button class="btn sec2" data-add="Vendedor">+ Adicionar '+(S.nv===1?"segundo":"terceiro")+' vendedor</button></div>';
  for(i=1;i<=S.nc;i++)h+=pessoa("Comprador",i);
  if(S.nc<3)h+='<div class="row"><button class="btn sec2" data-add="Comprador">+ Adicionar '+(S.nc===1?"segundo":"terceiro")+' comprador</button></div>';
  h+='<div class="card sec"><h2>O preço</h2>'+PRECO.map(function(c){return campo(c[0],c[1],c[2],c[3]);}).join("")+'</div>';
  h+='<div class="card sec"><h2>'+esc(TIPOS[t][0])+'</h2>'+pag.map(function(c){return campo(c[0],c[1],c[2],c[3],c[4]);}).join("")+'</div>';
  h+='<div class="card sec"><h2>Comissão e condições</h2>'+COM.map(function(c){return campo(c[0],c[1],c[2],c[3],c[4]);}).join("")+'</div>';
  h+='<div class="card"><b>Antes de enviar</b><p class="sub" style="margin:6px 0 0">Confira os campos em amarelo (lidos dos documentos). Ao enviar, o contrato é montado e vai primeiro para o Brenno e a Andréia conferirem; o PDF chega para você quando eles liberarem.</p><div class="row"><button class="btn verde" id="env" style="width:100%">Enviar para montar o contrato</button></div></div>';
  $("#tela").innerHTML=h;
  $$("[data-k]").forEach(function(el){el.addEventListener(el.tagName==="SELECT"?"change":"input",function(){var k=el.dataset.k;S.d[k]=el.value;if(S.ia[k]){delete S.ia[k];el.classList.remove("ia");var tg=el.previousElementSibling&&el.previousElementSibling.querySelector(".tagia");if(tg)tg.remove();}el.classList.remove("falta");sujo();});});
  $$("[data-add]").forEach(function(b){b.onclick=function(){if(b.dataset.add==="Vendedor")S.nv++;else S.nc++;contagens();desenhaForm();sujo();var p=$('[data-pes="'+b.dataset.add+' '+(b.dataset.add==="Vendedor"?S.nv:S.nc)+'"]');if(p)p.scrollIntoView({behavior:"smooth"});};});
  $$("[data-rm]").forEach(function(b){b.onclick=function(){var tp=b.dataset.rm,n=tp==="Vendedor"?S.nv:S.nc;if(!confirm("Remover "+tp+" "+n+" e os dados dele?"))return;PESSOA.forEach(function(c){delete S.d[tp+" "+n+" — "+c[0]];});if(tp==="Vendedor")S.nv--;else S.nc--;contagens();desenhaForm();sujo();};});
  $$(".docs").forEach(function(bx){$("input",bx).onchange=function(){lerDocs(bx,this.files);this.value="";};});
  $("#env").onclick=enviar;
  barra();
}
function contagens(){S.d["Existe um segundo vendedor?"]=S.nv>=2?"Sim":"Não, só um vendedor";S.d["Existe um terceiro vendedor?"]=S.nv>=3?"Sim":(S.nv>=2?"Não, só dois vendedores":"");
  S.d["Existe um segundo comprador?"]=S.nc>=2?"Sim":"Não, só um comprador";S.d["Existe um terceiro comprador?"]=S.nc>=3?"Sim":(S.nc>=2?"Não, só dois compradores":"");}
function barra(msg){var b=$("#barra");if(!b)return;b.classList.remove("hide");b.innerHTML='<span class="s" id="bs">'+(msg||(S.id?"Rascunho salvo":"Ainda não salvo"))+'</span><button class="btn sec2" id="bsv" style="padding:8px 12px">Salvar agora</button>';$("#bsv").onclick=function(){salvar();};}
var tmr=null;
function sujo(){S.sujo=true;var bs=$("#bs");if(bs)bs.textContent="Alterações não salvas…";guardaLocal(true);clearTimeout(tmr);tmr=setTimeout(salvar,2500);}
function guardaLocal(p){try{var d=JSON.parse(JSON.stringify(S.d));d.__ia=S.ia;ls(LSR,JSON.stringify({id:S.id,tipo:S.tipo,d:d,pendente:p}));}catch(e){}}
function dadosEnvio(){contagens();var d=JSON.parse(JSON.stringify(S.d));d.__ia=S.ia;return d;}
var fila=Promise.resolve();
function salvar(){clearTimeout(tmr);
  fila=fila.then(function(){if(!S.tipo)return;var bs=$("#bs");if(bs)bs.textContent="Salvando…";
    if(S.d["Seu CRECI"])ls("inovelar_ct_creci",S.d["Seu CRECI"]);
    return post("ctSalvar",[K,S.id,S.tipo,dadosEnvio()]).then(function(r){S.id=r.id;S.sujo=false;guardaLocal(false);var bs=$("#bs");if(bs)bs.textContent="Rascunho salvo às "+r.salvo.slice(11);})
      .catch(function(e){var bs=$("#bs");if(bs)bs.textContent="Não salvou ("+e.message+") — ficou guardado neste aparelho";});});
  return fila;}

/* ---------- leitura dos documentos ---------- */
function prepara(f){return new Promise(function(ok,no){
  if(f.type==="application/pdf"){if(f.size>6e6)return no(new Error(f.name+": PDF acima de 6 MB"));var r=new FileReader();r.onload=function(){ok({nome:f.name,mime:"application/pdf",b64:String(r.result).split(",")[1]});};r.onerror=no;r.readAsDataURL(f);return;}
  if(!/^image\//.test(f.type))return no(new Error(f.name+": envie foto ou PDF"));
  var img=new Image(),u=URL.createObjectURL(f);img.onload=function(){var M=1800,s=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok({nome:f.name,mime:"image/jpeg",b64:c.toDataURL("image/jpeg",0.85).split(",")[1]});};
  img.onerror=function(){no(new Error(f.name+": não consegui abrir a imagem"));};img.src=u;});}
function isoData(v){var m=String(v).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?m[3]+"-"+m[2]+"-"+m[1]:v;}
function lerDocs(bx,files){
  var papel=bx.dataset.papel,msg=$(".docmsg",bx),lista=[].slice.call(files||[]);if(!lista.length)return;
  msg.textContent="Preparando "+lista.length+" arquivo(s)…";
  (S.id?Promise.resolve():salvar()).then(function(){if(!S.id)throw new Error("Não consegui salvar o rascunho antes de ler. Confira a internet.");
    var p=Promise.resolve(),preench=0,avisos=[];
    lista.forEach(function(f,i){p=p.then(function(){msg.textContent="Lendo "+(i+1)+" de "+lista.length+": "+f.name+"…";return prepara(f);})
      .then(function(a){return post("ctLerDoc",[K,S.id,papel,a]);})
      .then(function(r){var c=r.campos||{};Object.keys(c).forEach(function(k){var key=papel==="Imóvel"?k:papel+" — "+k;if(S.d[key])return;
          var v=/data de nascimento$/.test(key)?isoData(c[k]):c[k];S.d[key]=v;S.ia[key]=1;preench++;});if(r.aviso)avisos.push(r.aviso);})
      .catch(function(e){avisos.push(e.message);});});
    return p.then(function(){desenhaForm();var bx2=$('.docs[data-papel="'+papel+'"]');if(bx2)$(".docmsg",bx2).textContent=(preench?"✔ "+preench+" campo(s) preenchidos pela leitura — estão em amarelo, confira.":"Nenhum campo novo preenchido.")+(avisos.length?"\n"+avisos.join("\n"):"")+"\nOs documentos ficaram guardados na pasta do pedido.";sujo();});})
  .catch(function(e){msg.textContent=e.message;});
}

/* ---------- enviar ---------- */
function obrig(){var t=S.tipo,L=[["Seu nome completo"],["Seu CRECI"]].concat(IMOVEL,PRECO,t==="fin"?FIN:t==="vista"?VISTA:PARC,COM),i,out=[];
  for(i=1;i<=S.nv;i++)PESSOA.forEach(function(c){L.push(["Vendedor "+i+" — "+c[0],"",c[2]]);});
  for(i=1;i<=S.nc;i++)PESSOA.forEach(function(c){L.push(["Comprador "+i+" — "+c[0],"",c[2]]);});
  L.forEach(function(c){if((c.length===1||c[2])&&!String(S.d[c[0]]||"").trim())out.push(c[0]);});return out;}
function cpfOk(c){c=String(c).replace(/\D/g,"");if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(var t=9;t<11;t++){var s=0;for(var i=0;i<t;i++)s+=+c[i]*(t+1-i);if(((s*10)%11)%10!==+c[t])return false;}return true;}
function enviar(){
  var f=obrig();$$("[data-k]").forEach(function(el){el.classList.toggle("falta",f.indexOf(el.dataset.k)>=0);});
  if(f.length){var p=$('[data-k="'+f[0].replace(/"/g,'\\"')+'"]');if(p){p.scrollIntoView({behavior:"smooth",block:"center"});p.focus();}alert("Faltam "+f.length+" campo(s) obrigatório(s), marcados em vermelho. O primeiro: "+f[0]);return;}
  var ruins=Object.keys(S.d).filter(function(k){return / — CPF$/.test(k)&&S.d[k]&&!cpfOk(S.d[k]);});
  if(ruins.length&&!confirm("Este CPF não confere pelos dígitos: "+ruins.join(", ")+".\n\nEnviar mesmo assim?"))return;
  var nIa=Object.keys(S.ia).length;
  if(!confirm((nIa?"Ainda há "+nIa+" campo(s) em amarelo, lidos dos documentos. Você conferiu?\n\n":"")+"Enviar para montar o contrato? Depois de enviado, só a gestão pode pedir ajuste."))return;
  var b=$("#env");b.disabled=true;b.textContent="Enviando…";
  salvar().then(function(){return post("ctEnviar",[K,S.id,S.tipo,dadosEnvio()]);}).then(function(){ls(LSR,null);S.tipo=null;mostrar("meus");aviso("Enviado! O contrato é montado em até 1 hora (8h às 22h) pelo modelo do Jurídico e vai primeiro para o Brenno e a Andréia conferirem. Você recebe o PDF por e-mail quando eles liberarem.",1);})
   .catch(function(e){b.disabled=false;b.textContent="Enviar para montar o contrato";alert("Não enviou: "+e.message);});
}
function aviso(t,ok){var d=document.createElement("div");d.className=ok?"ok":"aviso";d.textContent=t;var T=$("#tela");if(T)T.prepend(d);}

/* ---------- gestão ---------- */
function telaGestao(){
  var T=$("#tela");T.innerHTML='<h1>Gestão de contratos</h1><p class="sub">Pedidos enviados pelos corretores. O PDF gerado aparece aqui; confira e toque em <b>Liberar para o corretor</b> (ele recebe o PDF por e-mail e no app) ou <b>Pedir ajuste</b>.</p><div id="lg">Carregando…</div>';
  post("ctGestao",[K]).then(function(L){var G=$("#lg");if(!L.length){G.innerHTML='<div class="card">Nenhum pedido enviado ainda.</div>';return;}
    G.innerHTML=L.map(function(c){return '<div class="card"><span class="st '+c.status+'">'+(NOMEST[c.status]||c.status)+'</span> <b>'+esc(c.corretor)+'</b> · '+esc(TIPOS[c.tipo]?TIPOS[c.tipo][0]:c.tipo)+'<div class="item"><div class="r">'+esc(c.resumo)+'<br>'+esc(c.txt)+(c.pend?'<br>Pendências no contrato: '+esc(c.pend):'')+(c.obs?'<br><span style="font-size:13px">'+esc(c.obs)+'</span>':'')+'<br><span style="font-size:12px">'+esc(c.id)+'</span></div></div><div class="row">'+
      (c.pdf?'<a class="btn sec2" href="'+esc(c.pdf)+'" target="_blank">Abrir PDF</a>':'')+'<button class="btn sec2" data-v="'+c.id+'">Ver dados</button>'+(c.pasta?'<a class="btn sec2" href="'+esc(c.pasta)+'" target="_blank">Documentos</a>':'')+
      (c.status!=="liberado"&&c.pdf?'<button class="btn verde" data-lib="'+c.id+'">Liberar para o corretor</button>':'')+(c.status!=="liberado"?'<button class="btn red" data-aj="'+c.id+'">Pedir ajuste</button>':'')+'</div></div>';}).join("");
    $$("[data-v]",G).forEach(function(b){b.onclick=function(){verDados(b.dataset.v);};});
    $$("[data-lib]",G).forEach(function(b){b.onclick=function(){if(!confirm("Liberar o PDF para o corretor? Ele recebe por e-mail na hora."))return;b.disabled=true;b.textContent="Liberando…";post("ctLiberar",[K,b.dataset.lib]).then(function(){telaGestao();}).catch(function(e){alert(e.message);b.disabled=false;b.textContent="Liberar para o corretor";});};});
    $$("[data-aj]",G).forEach(function(b){b.onclick=function(){var m=prompt("O que o corretor precisa ajustar?");if(!m)return;b.disabled=true;post("ctAjuste",[K,b.dataset.aj,m]).then(function(){telaGestao();}).catch(function(e){alert(e.message);b.disabled=false;});};});
  }).catch(function(e){$("#lg").innerHTML='<div class="aviso">'+esc(e.message)+'</div>';});
}

/* ---------- partida ---------- */
var q=new URLSearchParams(location.search);
if(q.has("sair")){location.replace("acessos.html?sair");return;}
var k=q.get("k");if(k){k=k.replace(/[^A-Za-z0-9]/g,"").toUpperCase();if(/^[A-Z0-9]{8}$/.test(k))ls(LS,k);history.replaceState(null,"",location.pathname);if(!/^[A-Z0-9]{8}$/.test(k)){iniciar(k);return;}}
window.addEventListener("beforeunload",function(){if(S.sujo)guardaLocal(true);});
k=ls(LS); if(!k){telaLogin();return;} iniciar(k);
})();
</script>
</body>
</html>
